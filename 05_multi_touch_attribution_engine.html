<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Project Under Development</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    font-family: "Inter", sans-serif;
    background: linear-gradient(
        135deg,
        #0f172a 0%,
        #1e293b 40%,
        #2563eb 100%
    );
    overflow: hidden;
}

body::before {
    content: "";
    position: absolute;
    width: 600px;
    height: 600px;
    background: rgba(255,255,255,0.06);
    border-radius: 50%;
    top: -250px;
    right: -150px;
    filter: blur(30px);
}

body::after {
    content: "";
    position: absolute;
    width: 500px;
    height: 500px;
    background: rgba(59,130,246,0.25);
    border-radius: 50%;
    bottom: -250px;
    left: -150px;
    filter: blur(60px);
}

.card {
    position: relative;
    z-index: 2;
    max-width: 700px;
    padding: 60px;
    text-align: center;
    border-radius: 24px;
    backdrop-filter: blur(20px);
    background: rgba(255,255,255,0.08);
    border: 1px solid rgba(255,255,255,0.15);
    box-shadow: 0 20px 60px rgba(0,0,0,0.25);
}

.badge {
    display: inline-block;
    padding: 10px 18px;
    margin-bottom: 24px;
    border-radius: 999px;
    background: rgba(59,130,246,0.2);
    color: #bfdbfe;
    font-size: 0.9rem;
    font-weight: 600;
}

h1 {
    color: white;
    font-size: 3rem;
    margin-bottom: 20px;
    font-weight: 700;
}

p {
    color: rgba(255,255,255,0.85);
    font-size: 1.15rem;
    line-height: 1.7;
    margin-bottom: 30px;
}

.loader {
    display: flex;
    justify-content: center;
    gap: 10px;
}

.loader span {
    width: 12px;
    height: 12px;
    border-radius: 50%;
    background: white;
    animation: bounce 1.4s infinite ease-in-out;
}

.loader span:nth-child(2) {
    animation-delay: 0.2s;
}

.loader span:nth-child(3) {
    animation-delay: 0.4s;
}

@keyframes bounce {
    0%, 80%, 100% {
        transform: scale(0.7);
        opacity: 0.5;
    }
    40% {
        transform: scale(1.3);
        opacity: 1;
    }
}
</style>
</head>
<body>

<div class="card">
    <div class="badge">Coming Soon</div>

    <h1>Project Under Development</h1>

    <p>
        Improvements are currently in progress.
        Please check back soon for updates.
    </p>

    <div class="loader">
        <span></span>
        <span></span>
        <span></span>
    </div>
</div>

</body>
</html>
